[package]
name = "tauri-music"
version = "0.1.0"
description = "Apple Music 风格的本地音乐播放器"
authors = ["O_Art3mis"]
edition = "2021"

[lib]
name = "tauri_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
rfd = "0.15"
walkdir = "2"
encoding_rs = "0.8"
sevenz-rust = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "gzip"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
